# ZFW CI — runs on every push and pull request.
#
# Phases:
#   1. lint     — gofmt + go vet, fast feedback if formatting is wrong
#   2. vuln     — govulncheck against the Go vulnerability database
#   3. test     — go test ./... -race, the unit suite must stay green
#   4. build    — build.sh produces dist/zfw-<v>.tar.gz (the release artifact)
#   5. arm64    — smoke build for arm64 so we catch portability regressions
#                 before the Mod-Store multi-arch release lands
#   6. docker   — release tags only: pushes the installer image
#                 chicohaager/zfw:<version> + :latest (amd64 + arm64) from the
#                 modules of this run's release artifact, then checks what the
#                 registry serves. Needs the repository secrets
#                 DOCKERHUB_USERNAME and DOCKERHUB_TOKEN; without them the job
#                 fails loudly instead of leaving a release without its image.
#
# Notes:
#   - reproducible-build verification: build.sh respects SOURCE_DATE_EPOCH
#     and uses --mtime/--sort/--all-time flags throughout; CI runs the build
#     twice and asserts the tarball SHA256 matches.
#   - signing (cosign) is intentionally not wired up yet — adding it
#     requires committing the public verification key + a strategy for the
#     private key (GitHub OIDC or KMS); revisit at the Mod-Store submission.

name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

# Least privilege by default. Without this the workflow inherits the
# repository-default GITHUB_TOKEN scope, which on older repos is write-all —
# far more than any job here needs. Every job below only reads the checkout.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # go-version-file: the toolchain comes from the go directive in go.mod —
      # one place to bump, and build.sh on a developer box switches to the
      # same version via GOTOOLCHAIN=auto. cache: false because ZFW has no
      # third-party modules (no go.sum), so there is nothing to key a cache on.
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: false }
      # openapi.yaml is gitignored and generated from docs/ at build time; the
      # //go:embed in internal/handlers needs it present or `go vet` errors out.
      - run: cp docs/openapi.yaml internal/handlers/openapi.yaml
      - run: gofmt -l . | tee /tmp/fmt && [ ! -s /tmp/fmt ]
      - run: go vet ./...

  # Advisory, not gating. govulncheck against the standard library tracks
  # the toolchain's patch level, so there is almost always a "fixed in the
  # next patch" stdlib finding — gating on that would turn every release
  # tag red on the day a stdlib CVE lands. continue-on-error keeps the
  # signal visible (a red ✗ in the checks list = time to bump Go or a
  # dependency) without blocking the release. The scan runs with the SAME
  # toolchain the release is built with (go.mod), so a red ✗ here is a
  # statement about the shipped binary — not about some newer Go.
  vuln:
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: false }
      - name: govulncheck
        run: |
          cp docs/openapi.yaml internal/handlers/openapi.yaml
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: false }
      - run: cp docs/openapi.yaml internal/handlers/openapi.yaml
      - run: go test ./... -race -count=1

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: false }
      - name: Install squashfs-tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      # Pinned, not @latest: this runs inside the job that produces the published
      # release tarball, so a compromised upstream release of the SBOM tool would
      # execute right next to the artifact it is meant to describe. Bump
      # deliberately. -trimpath because the SBOM records the tool's own
      # binary hash (metadata.tools[].hashes): without it the hash carries
      # the build host's paths, and the tarball differs between CI and a
      # developer box although every shipped byte is identical.
      - name: Install cyclonedx-gomod (SBOM)
        run: go install -trimpath github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
      - name: First build
        run: bash build.sh
      - name: Capture first tarball SHA
        id: sha1
        # build.sh emits one tarball per arch (amd64+arm64), so hash the set of
        # per-file digests into one value — a multi-line $GITHUB_OUTPUT is
        # rejected ("Invalid format").
        run: echo "sha=$(sha256sum dist/zfw-*.tar.gz | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Clean
        run: rm -rf dist/ raw/usr/bin/zfwd internal/handlers/openapi.yaml
      - name: Second build (reproducibility check)
        run: bash build.sh
      - name: Compare SHAs
        run: |
          NEW=$(sha256sum dist/zfw-*.tar.gz | sort | sha256sum | cut -d' ' -f1)
          OLD="${{ steps.sha1.outputs.sha }}"
          if [ "$NEW" != "$OLD" ]; then
            echo "REPRODUCIBILITY REGRESSION: $OLD -> $NEW"
            exit 1
          fi
          echo "reproducible build OK: $NEW"
      - uses: actions/upload-artifact@v7
        with:
          name: zfw-release
          path: |
            dist/zfw-*.tar.gz
            dist/zfw-*.tar.gz.sha256
            dist/sbom.json
          if-no-files-found: error

  arm64-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: false }
      - name: Cross-build for arm64 (no sysext pack)
        run: |
          cp docs/openapi.yaml internal/handlers/openapi.yaml
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false \
            -ldflags="-s -w" -o /tmp/zfwd-arm64 ./cmd/zfwd
          file /tmp/zfwd-arm64

  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [lint, vuln, build, arm64-smoke]
    env:
      IMAGE: chicohaager/zfw
    steps:
      - uses: actions/checkout@v7
      - name: Docker Hub secrets present
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then
            echo "::error::repository secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set — this release gets no installer image"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with: { name: zfw-release, path: release }
      # The image carries the modules of the release artifact, byte for byte —
      # not a second build. The script verifies every checksum on the way.
      - name: Version from the tag
        id: ver
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Stage the released modules for the Dockerfile
        run: sh tools/stage-docker-payload.sh release "${{ steps.ver.outputs.v }}"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.v }}
            ${{ env.IMAGE }}:latest
      # A local `docker images` proves nothing; pull each architecture back out
      # of the registry and compare its payload with the released module.
      - name: Verify what the registry serves
        run: |
          V="${{ steps.ver.outputs.v }}"
          for a in amd64 arm64; do
            got=$(docker run --rm --pull=always --platform "linux/$a" --entrypoint sh "$IMAGE:$V" -c 'sha256sum /payload/zfw.raw' | cut -d' ' -f1)
            want=$(cut -d' ' -f1 "dist/zfw-$a.raw.sha256")
            echo "$a registry=$got release=$want"
            [ -n "$got" ] && [ "$got" = "$want" ] || { echo "::error::$a payload in $IMAGE:$V does not match the release"; exit 1; }
          done
